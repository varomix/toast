<!doctype html>
<!--
  GitHub social preview for the Toast repository (Settings > General > Social preview).
  Render to images/social_preview.png (1280 x 640) from the repository root with:
    google-chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1280,640 --screenshot=images/social_preview.png images/social_preview.html
  Everything important stays inside the 80 px margin GitHub may crop.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(520px 520px at 300px 330px, rgba(240, 160, 80, .30), transparent 70%),
      radial-gradient(900px 500px at 1100px 80px, rgba(184, 98, 27, .16), transparent 70%),
      linear-gradient(135deg, #1b1510 0%, #241a12 55%, #2d1f13 100%);
    color: #f6e9d6;
    font-family: "Noto Sans", "DejaVu Sans", sans-serif;
  }
  .card {
    position: absolute; inset: 80px; display: flex; align-items: center; gap: 56px;
  }
  .icon {
    width: 400px; height: 400px; flex: none; margin-left: 4px;
    filter: drop-shadow(0 18px 34px rgba(0, 0, 0, .45)) drop-shadow(0 0 40px rgba(240, 150, 60, .25));
  }
  .text { display: flex; flex-direction: column; min-width: 0; }
  h1 {
    margin: 0; font-size: 120px; line-height: 1; font-weight: 800; letter-spacing: -3px;
    color: #fbefdc;
  }
  .tagline {
    margin: 14px 0 22px; font-size: 31px; line-height: 1.32; color: #dcc6a8; font-weight: 500;
  }
  .tagline b { color: #f3b26e; font-weight: 700; }
  pre {
    margin: 0; padding: 18px 22px; border-radius: 16px; font-size: 22px; line-height: 1.5;
    font-family: "DejaVu Sans Mono", monospace; color: #eadfd2;
    background: rgba(12, 9, 6, .55); border: 1px solid rgba(240, 160, 80, .22);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .attr { color: #f0a050; font-weight: 700; }
  .fn { color: #6cc3df; }
  .num { color: #8fd19e; }
  .str { color: #e6c66e; }
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="toast_icon_1024.png" alt="">
  <div class="text">
    <h1>Toast</h1>
    <div class="tagline">Python-syntax kernels for <b>Blender geometry&nbsp;nodes</b>, compiled to native code</div>
<pre>n = <span class="fn">noise</span>(<span class="attr">@position</span> * <span class="num">4</span>)
<span class="attr">@position</span> += <span class="attr">@normal</span> * n * <span class="num">0.2</span>
<span class="fn">output</span>(<span class="str">"top"</span>, <span class="attr">@normal</span>.z &gt; <span class="num">0.7</span>)</pre>
  </div>
</div>
</body>
</html>
